name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run automated test suite
        run: python3 -m unittest discover -s tests -v

      - name: Enforce zero-emoji policy
        run: |
          python3 -c "
          import os, sys

          def check_file(path):
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              for i, ch in enumerate(content):
                  cp = ord(ch)
                  if (0x1F300 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF or 
                      0x1F600 <= cp <= 0x1F64F or 0x1F680 <= cp <= 0x1F6FF or
                      0x2300 <= cp <= 0x23FF or 0x2B50 <= cp <= 0x2B55):
                      print(f'Emoji violation detected in {path}: {ch} (U+{cp:04X})')
                      return False
              return True

          clean = True
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for file in files:
                  if file.endswith(('.py', '.js', '.css', '.html', '.md', '.c', '.json', '.txt', '.yml', '.yaml')):
                      p = os.path.join(root, file)
                      if not check_file(p):
                          clean = False

          if not clean:
              sys.exit(1)
          print('Zero-emoji verification passed.')
          "

      - name: Build static distribution for GitHub Pages
        run: python3 build_dist.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
